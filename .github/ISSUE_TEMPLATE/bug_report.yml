name: 问题报告
description: 记录可复现的问题和验证环境
body:
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 应用版本、macOS 版本、芯片架构、模块型号和固件；不要填写 IMEI、ICCID 或凭据。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 说明实际行为、预期行为和复现频率。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志与截图
      description: 先隐藏手机号、短信内容、验证码、SIM 身份和通知凭据。
