name: CI

on:
  push:
    branches: [main, 'codex/**', 'repair/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Source and repository checks
        run: make check
      - name: Portable tests
        run: make test-nocgo

  test-macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native dependencies
        run: brew install pkg-config libusb
      - name: Source and repository checks
        run: make check
      - name: Static analysis
        run: go vet ./...
      - name: Race tests
        run: make test-race
      - name: Swift service lifecycle tests
        run: make test-client
      - name: Build service and menu bar client
        run: make build client
      - name: Embedded web and HTTP smoke test
        run: make test-demo
      - name: Check scripts
        run: sh -n packaging/dj4ghub packaging/install scripts/build-macos.sh scripts/package-macos-arm64.sh
      - name: Test
        run: go test ./...
      - name: Test web traffic and phone controls
        run: node --test scripts/*.test.cjs
      - name: Test native traffic calculations
        run: |
          traffic_check_dir=$(mktemp -d)
          swiftc apps/hub-macos/Sources/DJ4Hub/Service.swift \
            apps/hub-macos/Sources/DJ4Hub/TrafficHistory.swift \
            scripts/test-network-traffic.swift -o "$traffic_check_dir/check-traffic"
          "$traffic_check_dir/check-traffic"
