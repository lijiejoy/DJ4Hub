name: Release macOS

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install build dependencies
        run: |
          brew install pkg-config libusb
          brew install --cask android-platform-tools
      - name: Test
        run: make check test test-client
      - name: Build complete app archive
        run: sh scripts/package-macos-statusbar-app.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-${{ matrix.arch }}
          path: |
            dist/release/DJ-4G-Hub-App-macOS-${{ matrix.arch }}-${{ github.ref_name }}.zip
            dist/release/DJ-4G-Hub-App-macOS-${{ matrix.arch }}-${{ github.ref_name }}.zip.sha256
          if-no-files-found: error

  draft-release:
    needs: build-app
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: app-*
          merge-multiple: true
          path: release-assets
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "DJ 4G Hub ${GITHUB_REF_NAME}"
